data:
  cohorts:
  - ispy1
  - ispy2
  - duke
  prefer_cache: v2
  norm: kinetic
  crop: tumor
  zoom: 1.6
  fov_mm: 100
  slice_mode: mid
  mid_frac: 0.6
  k_train: 8
  k_eval: 12
  num_workers: 4
  sampler: random
model:
  backbone: mae
  pool: gap
  aggregation: mean_logit
  train_blocks: 4
  grad_checkpointing: true
  dropout: 0.2
loss:
  bce_weight: 1.0
  focal_weight: 0.0
  focal_gamma: 2.0
  pos_weight: null
optim:
  lr_head: 0.001
  lr_backbone: 3.0e-05
  layer_decay: 0.75
  weight_decay: 0.05
  warmup_epochs: 1
  freeze_epochs: 2
  max_epochs: 20
  patience: 6
  batch_patients: 8
  amp: true
  grad_clip: 1.0
aug:
  flip: true
  rotate_deg: 15
  scale:
  - 0.9
  - 1.1
  intensity: 0.1
  crop_jitter: 8
name: vo_base
seed: 0
