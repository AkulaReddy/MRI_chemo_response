data:
  cohorts:
  - ispy1
  - ispy2
  train_splits:
  - train
  k_train: 8
  k_eval: 16
  margin: 0
  min_area_frac: 0.0
  preload: false
  num_workers: 4
  sampler: random
clinical:
  features: []
model:
  kind: image_only
  backbone: facebook/dinov2-base
  pretrained: true
  train_blocks: 2
  input_phases: early
  grad_checkpointing: true
  aggregation: mean_logit
  d_model: 256
  n_layers: 2
  n_heads: 4
  ffn: 512
  dropout: 0.2
  drop_path: 0.0
  aux_heads: false
loss:
  bce_weight: 0.5
  focal_weight: 0.5
  focal_gamma: 2.0
  pos_weight: null
  aux_weight: 0.0
optim:
  lr_head: 0.001
  lr_backbone: 3.0e-05
  layer_decay: 0.75
  weight_decay: 0.05
  warmup_epochs: 1
  max_epochs: 30
  patience: 15
  batch_patients: 8
  amp: true
  grad_clip: 1.0
aug:
  flip: true
  rotate_deg: 15
  scale:
  - 0.9
  - 1.1
  intensity: 0.1
  crop_jitter: 8
export:
  k: 32
  after_train: true
name: b3_vit
seed: 0
